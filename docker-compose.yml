version: "3.8"

# One-command local Postgres setup: `docker compose up -d`
# Creates both the dev database (fleet_ops) and test database
# (fleet_ops_test) with credentials matching .env.example exactly.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fleet_ops
    ports:
      - "5432:5432"
    volumes:
      - fleet_ops_pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  fleet_ops_pgdata:
